<title>Tower Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
/* Layout: a native-feeling inspector window. A source list on the left, one view at a time beside it.
   Each of the tower's languages has its own hue, used everywhere that language's things appear. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --side: #e9ebef; --line: #dadde3; --line-soft: #e8eaee;
  --fg: #1a1d23; --muted: #5f6672; --faint: #8b919c; --sel: #dbe6fb; --hover: #eef1f5;
  --code-bg: #fafbfc; --hl: #fff1b8; --hl-strong: #ffe27a;
  --good: #2c8a4a; --good-bg: #e3f4e8; --bad: #c2352a; --bad-bg: #fbe7e5;
  --l-syntax: #0e7676; --l-scopes: #a25f00; --l-attrs: #6747c0; --l-facts: #2360b5;
  --l-rewrite: #b3305a; --l-rules: #3b7636; --l-pipeline: #87562a; --l-bundler: #5a616d; --l-kinds: #0e7676;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --font-head: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141619; --panel: #1b1e22; --side: #111316; --line: #2c3038; --line-soft: #23272d;
  --fg: #e4e6ea; --muted: #9aa1ad; --faint: #6e7581; --sel: #24365a; --hover: #22262c;
  --code-bg: #17191d; --hl: #4a3f12; --hl-strong: #6b5814;
  --good: #6acb86; --good-bg: #183324; --bad: #f2776b; --bad-bg: #3a1c1a;
  --l-syntax: #4cc2bd; --l-scopes: #e5a64a; --l-attrs: #a890f0; --l-facts: #78a6f0;
  --l-rewrite: #ef7898; --l-rules: #8cc782; --l-pipeline: #d29f6e; --l-bundler: #a0a7b3; --l-kinds: #4cc2bd;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141619; --panel: #1b1e22; --side: #111316; --line: #2c3038; --line-soft: #23272d;
  --fg: #e4e6ea; --muted: #9aa1ad; --faint: #6e7581; --sel: #24365a; --hover: #22262c;
  --code-bg: #17191d; --hl: #4a3f12; --hl-strong: #6b5814;
  --good: #6acb86; --good-bg: #183324; --bad: #f2776b; --bad-bg: #3a1c1a;
  --l-syntax: #4cc2bd; --l-scopes: #e5a64a; --l-attrs: #a890f0; --l-facts: #78a6f0;
  --l-rewrite: #ef7898; --l-rules: #8cc782; --l-pipeline: #d29f6e; --l-bundler: #a0a7b3; --l-kinds: #4cc2bd;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font-ui); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--l-facts); outline-offset: 1px; }
code, .mono { font-family: var(--font-code); font-size: 12px; }
/* code is read as written: no ligatures turning => or !== into other glyphs */
code, .mono, pre, svg text, .chip, .item.decl .nm, .lines, .scode, .outcode { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }

.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); height: 100%; }
.side { background: var(--side); border-right: 1px solid var(--line); padding-block: 14px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 6px; }
.brand b { font: 700 15px/1.2 var(--font-head); letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 11.5px; }
.tower { display: flex; gap: 2px; margin-top: 8px; height: 5px; border-radius: 3px; overflow: hidden; }
.tower i { display: block; }
.navgroup { display: flex; flex-direction: column; gap: 1px; }
.navgroup h3 { margin: 0 0 4px; padding: 0 8px; font: 600 10.5px/1 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.nav { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; border: 0; background: none; text-align: left; cursor: pointer; width: 100%; }
.nav:hover { background: var(--hover); }
.nav[aria-current="page"] { background: var(--sel); font-weight: 600; }
.nav .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.nav small { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11px; }
.side-note { margin-top: auto; color: var(--faint); font-size: 11px; padding: 0 8px; }

.main { min-width: 0; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.bar h1 { margin: 0; font: 600 16px/1.2 var(--font-head); letter-spacing: -0.01em; }
.bar p { margin: 0; color: var(--muted); flex: 1 1 320px; min-width: 0; }
.prov { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 2px 9px; white-space: nowrap; }
.prov i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.prov.hand i { background: var(--l-scopes); }
.view { flex: 1; min-height: 0; overflow: auto; padding-block: 16px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.view.flush { padding: 0; overflow: hidden; display: flex; }

/* shared pieces */
.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 11px/1.5 var(--font-code); padding: 0 6px; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--c, var(--muted)) 40%, transparent); color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 8%, transparent); cursor: pointer; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: baseline; }
.chip:hover { background: color-mix(in srgb, var(--c, var(--muted)) 18%, transparent); }
.tag { display: inline-block; font: 600 10px/1.6 var(--font-ui); letter-spacing: 0.04em; text-transform: uppercase; padding: 0 5px; border-radius: 3px; color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 12%, transparent); }
.lc-syntax { --c: var(--l-syntax) } .lc-scopes { --c: var(--l-scopes) } .lc-attrs { --c: var(--l-attrs) } .lc-facts { --c: var(--l-facts) }
.lc-rewrite { --c: var(--l-rewrite) } .lc-rules { --c: var(--l-rules) } .lc-pipeline { --c: var(--l-pipeline) } .lc-bundler { --c: var(--l-bundler) } .lc-kinds { --c: var(--l-kinds) }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line-soft); font-weight: 600; font-size: 12px; }
.panel > header .sub { color: var(--faint); font-weight: 400; margin-left: auto; font-size: 11px; }
.section-title { font: 600 10.5px/1 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
pre.code { margin: 0; padding: 10px 12px; font: 12px/1.6 var(--font-code); background: var(--code-bg); overflow: auto; white-space: pre; tab-size: 2; }
.muted { color: var(--muted); }
.k-com { color: var(--faint); font-style: italic; }
.k-str { color: var(--l-rewrite); }
.k-kind { color: var(--l-syntax); }
.k-kw { color: var(--l-attrs); font-weight: 500; }
.k-host { color: var(--l-pipeline); }
.k-num { color: var(--l-facts); }
mark { background: var(--hl); color: inherit; border-radius: 2px; }
.empty { color: var(--faint); padding: 14px; }

/* trace */
.qrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.q { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 4px 11px; cursor: pointer; font-size: 12.5px; }
.q:hover { border-color: var(--faint); }
.q[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.q.bug::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-right: 6px; vertical-align: 1px; }
.trace { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 14px; align-items: start; }
.trace-left { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cmd { font: 12px/1.5 var(--font-code); color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line-soft); overflow-x: auto; white-space: nowrap; }
.cmd b { color: var(--fg); font-weight: 500; }
.outcode { margin: 0; padding: 12px; font: 13px/1.75 var(--font-code); white-space: pre-wrap; word-break: break-all; }
.outcode .seg { border-radius: 2px; cursor: default; }
.outcode .seg.in-piece { background: color-mix(in srgb, var(--l-facts) 10%, transparent); cursor: pointer; }
.outcode .seg.sel-piece { background: var(--hl); }
.outcode .seg.sel-piece.bugp { background: var(--bad-bg); box-shadow: inset 0 -2px 0 var(--bad); }
.outcode .seg:hover { outline: 1px solid var(--l-facts); }
.srcs { display: grid; gap: 0; }
.srcs .fname { font: 600 11px/1 var(--font-code); color: var(--muted); padding: 8px 12px 0; display: flex; gap: 8px; align-items: center; }
.srcs pre { margin: 0; padding: 4px 12px 10px; font: 12px/1.6 var(--font-code); white-space: pre-wrap; word-break: break-word; }
.srcs pre + .fname { border-top: 1px solid var(--line-soft); }
.srcs mark.piece { background: var(--hl); }
.srcs mark.piece.bugp { background: var(--bad-bg); box-shadow: inset 0 -2px 0 var(--bad); }
.srcs mark.dropped { background: none; text-decoration: line-through; text-decoration-color: var(--faint); color: var(--faint); }
.srcs mark.maphit { background: var(--hl-strong); outline: 1px solid var(--l-scopes); }
.maphint { font-size: 11.5px; color: var(--faint); padding: 0 12px 10px; min-height: 1.6em; }
.why { padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; }
.why h2 { margin: 0; font: 600 17px/1.3 var(--font-head); letter-spacing: -0.01em; text-wrap: balance; }
.why .lede { margin: 0; max-width: 68ch; font-size: 13.5px; line-height: 1.55; }
.callout { border-left: 3px solid var(--bad); background: var(--bad-bg); padding: 8px 12px; border-radius: 0 var(--r) var(--r) 0; font-size: 12.5px; }
.callout code { font-size: 11.5px; }
.deriv { list-style: none; margin: 0; padding: 0; }
.deriv ul { list-style: none; margin: 0; padding-left: 18px; border-left: 1px dashed var(--line); margin-left: 6px; }
.deriv li { padding: 3px 0; }
.fact { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.fact .f { font: 500 12px/1.5 var(--font-code); }
.fact.bug .f { color: var(--bad); }
.fact .given { color: var(--muted); font-size: 12px; }
.fact .tw { border: 0; background: none; padding: 0; width: 14px; color: var(--faint); cursor: pointer; font-size: 10px; }
.rw { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 4px 10px; align-items: center; }
.rw code { background: var(--code-bg); border: 1px solid var(--line-soft); border-radius: 4px; padding: 2px 6px; overflow-wrap: anywhere; }
.rw .note { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-bottom: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.cands { display: flex; flex-direction: column; gap: 8px; }
.cand { border: 1px solid var(--line-soft); border-radius: var(--r); padding: 8px 10px; }
.cand code.r { display: block; font-size: 11.5px; overflow-x: auto; white-space: pre; }
.cand .miss { color: var(--bad); font-size: 12px; margin-top: 4px; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp pre { margin: 0; font: 11.5px/1.55 var(--font-code); background: var(--code-bg); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 8px 10px; white-space: pre-wrap; word-break: break-all; }
.cmp h4 { margin: 0 0 4px; font-size: 11px; color: var(--muted); font-weight: 600; }

/* browser */
.browser { display: grid; grid-template-columns: 168px 210px 250px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); width: 100%; height: 100%; }
.col { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
.col > header { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); font: 600 10.5px/1.4 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.col .list { overflow-y: auto; flex: 1; padding: 4px; }
.item { display: flex; align-items: center; gap: 6px; padding: 3px 7px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; border: 0; background: none; width: 100%; text-align: left; font-size: 12.5px; }
.item:hover { background: var(--hover); }
.item[aria-selected="true"] { background: var(--sel); }
.item .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.item .ct { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.item.decl .nm { font: 12px/1.5 var(--font-code); }
.item .kd { flex: none; font: 600 9.5px/1.5 var(--font-ui); text-transform: uppercase; letter-spacing: 0.04em; color: var(--c); width: 46px; overflow: hidden; text-overflow: ellipsis; }
.search { margin: 6px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); font: 12px var(--font-ui); color: var(--fg); }
.srcpane { display: grid; grid-template-rows: auto minmax(0, 1.4fr) minmax(0, 1fr); min-height: 0; min-width: 0; background: var(--panel); }
.srchead { padding: 7px 12px; border-bottom: 1px solid var(--line-soft); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.srchead .path { font: 500 12px var(--font-code); }
.srchead .doc { flex-basis: 100%; color: var(--muted); font-size: 12px; max-width: 90ch; }
.hist { display: flex; gap: 2px; margin-left: auto; }
.hist button { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; width: 26px; height: 22px; cursor: pointer; }
.hist button:disabled { opacity: 0.35; cursor: default; }
.lines { overflow: auto; font: 12px/1.6 var(--font-code); background: var(--code-bg); border-bottom: 1px solid var(--line); }
.ln { display: flex; white-space: pre; padding-right: 12px; }
.ln .n { flex: none; width: 48px; text-align: right; padding-right: 12px; color: var(--faint); user-select: none; }
.ln.in { background: color-mix(in srgb, var(--hl) 70%, transparent); }
.ln.at .n { color: var(--fg); font-weight: 700; }
.refs { overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 12px; }
.refgroup h4 { margin: 0 0 4px; font-size: 11.5px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.ref { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 3px 6px; border-radius: 4px; cursor: pointer; align-items: baseline; }
.ref:hover { background: var(--hover); }
.ref .where { font: 11px var(--font-code); color: var(--muted); white-space: nowrap; }
.ref .txt { font: 11.5px var(--font-code); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* grammar */
.split { display: grid; grid-template-columns: 230px minmax(0, 1fr); width: 100%; height: 100%; }
.rr-wrap { overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.rr-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rr-title h2 { margin: 0; font: 600 20px/1.2 var(--font-code); }
.rr-doc { margin: 0; color: var(--muted); max-width: 72ch; }
.rr { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
svg.railroad { display: block; }
svg.railroad path { stroke: var(--faint); stroke-width: 1.5; fill: none; }
svg.railroad .term rect { fill: color-mix(in srgb, var(--l-rewrite) 10%, var(--panel)); stroke: var(--l-rewrite); stroke-width: 1.2; }
svg.railroad .term text { fill: var(--l-rewrite); }
svg.railroad .nt rect { fill: var(--panel); stroke: var(--l-syntax); stroke-width: 1.2; }
svg.railroad .nt text { fill: var(--l-syntax); }
svg.railroad .nt { cursor: pointer; }
svg.railroad .nt:hover rect { fill: color-mix(in srgb, var(--l-syntax) 14%, var(--panel)); }
svg.railroad .cls rect { fill: var(--code-bg); stroke: var(--muted); stroke-dasharray: 2 2; }
svg.railroad .cls text { fill: var(--muted); }
svg.railroad .flag rect { fill: color-mix(in srgb, var(--l-attrs) 12%, var(--panel)); stroke: none; }
svg.railroad .flag text { fill: var(--l-attrs); }
svg.railroad .act rect { fill: var(--l-syntax); stroke: none; }
svg.railroad .act text { fill: var(--panel); font-weight: 700; }
svg.railroad .pred > rect { fill: none; stroke: var(--l-scopes); stroke-dasharray: 4 3; }
svg.railroad .pred > text { fill: var(--l-scopes); font-size: 10px; }
svg.railroad text { font: 12px var(--font-code); dominant-baseline: central; text-anchor: middle; }
svg.railroad .keep { fill: var(--l-pipeline); font-size: 10px; }
svg.railroad .cap { fill: var(--faint); }
.infix { border-collapse: collapse; font-size: 12px; }
.infix td, .infix th { border-bottom: 1px solid var(--line-soft); padding: 5px 10px; text-align: left; vertical-align: top; }
.infix th { color: var(--faint); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; }
.opchip { display: inline-flex; gap: 6px; margin: 0 6px 4px 0; padding: 1px 7px; border: 1px solid var(--line); border-radius: 4px; font: 12px var(--font-code); }
.opchip b { color: var(--l-rewrite); font-weight: 500; }
.opchip span { color: var(--l-syntax); }

/* facts */
.facts { display: grid; grid-template-columns: minmax(0, 1fr) 360px; width: 100%; height: 100%; }
.graph { overflow: auto; position: relative; background: var(--bg); }
.graph .tools { position: sticky; top: 0; left: 0; z-index: 2; display: flex; gap: 8px; padding: 8px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); align-items: center; flex-wrap: wrap; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg-ctl button { border: 0; background: none; padding: 3px 10px; cursor: pointer; font-size: 12px; border-right: 1px solid var(--line); }
.seg-ctl button:last-child { border-right: 0; }
.seg-ctl button[aria-pressed="true"] { background: var(--sel); font-weight: 600; }
svg.rg .edge { fill: none; stroke: var(--line); stroke-width: 1.2; }
svg.rg .edge.neg { stroke-dasharray: 4 3; }
svg.rg .edge.on { stroke: var(--l-facts); stroke-width: 1.8; }
svg.rg .edge.in { stroke: var(--l-rewrite); stroke-width: 1.8; }
svg.rg .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
svg.rg .node.base rect { fill: var(--code-bg); stroke-dasharray: 3 2; }
svg.rg .node text { font: 11.5px var(--font-code); fill: var(--fg); dominant-baseline: central; }
svg.rg .node .rec { fill: var(--l-facts); font-size: 10px; }
svg.rg .node { cursor: pointer; }
svg.rg .node.sel rect { stroke: var(--l-facts); stroke-width: 2; fill: color-mix(in srgb, var(--l-facts) 14%, var(--panel)); }
svg.rg .node.dim { opacity: 0.28; }
svg.rg .node.traced rect { stroke: var(--l-scopes); stroke-width: 1.6; }
svg.rg .node.xl text { font-weight: 500; }
svg.rg .layer { font: 600 10px var(--font-ui); fill: var(--faint); letter-spacing: 0.06em; }
.inspector { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.inspector h2 { margin: 0; font: 600 17px/1.2 var(--font-code); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.inspector .cols { font: 12px var(--font-code); color: var(--muted); }
.rule { font: 11.5px/1.6 var(--font-code); background: var(--code-bg); border: 1px solid var(--line-soft); border-radius: 5px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.rule .head { font-weight: 700; }
.rule .atom { cursor: pointer; border-radius: 3px; }
.rule .atom:hover { background: var(--sel); }
.rule .atom.neg { color: var(--bad); }
.rule .atom.me { color: var(--l-facts); font-weight: 700; }
.rule footer { display: flex; justify-content: flex-end; }

/* rewrites */
.rw-grid { display: flex; flex-direction: column; gap: 18px; }
.rw-sec h2 { margin: 0 0 8px; font: 600 13px/1.2 var(--font-head); text-transform: capitalize; }
.rw-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; }
.rwc { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  return { svg: `<svg class="rg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${heads}${es}${ns}</svg>`, focus: null };
}
function renderFacts(view) {
  const files = Object.keys(DATA.facts).filter(f => DATA.facts[f].length);
  if (!F.sel || !DATA.decls.find(d => d.file === F.file && d.name === F.sel && d.kind === "relation")) { const g0 = DATA.decls.find(d => d.file === F.file && d.kind === "relation"); F.sel = g0 && g0.name; }
  F.mode ||= "near";
  const g = factsGraph(F.file);
  const sel = g.idx[F.sel];
  const out = F.mode === "near" ? nearSVG(g, sel) : wholeSVG(g, sel);
  view.innerHTML = `<div class="facts"><div class="graph" id="graph"><div class="tools"><span class="seg-ctl" role="group" aria-label="Facts file">${files.map(f => `<button data-ff="${esc(f)}" aria-pressed="${f === F.file}">${esc(short(f).split("/").pop())}</button>`).join("")}</span>
      <span class="seg-ctl" role="group" aria-label="Graph"><button data-fm="near" aria-pressed="${F.mode === "near"}">Neighbourhood</button><button data-fm="all" aria-pressed="${F.mode === "all"}">Whole program</button></span>
      <span class="muted" style="font-size:11.5px">Dashed: given, not derived. ↻ recursive. Dashed edge: read negated. Gold: in the trace.</span></div>
    <div style="padding:6px 12px 20px">${out.svg}</div></div><aside class="inspector" id="finsp"></aside></div>`;
  view.querySelectorAll("[data-ff]").forEach(b => b.onclick = () => { F.file = b.dataset.ff; F.sel = null; renderFacts(view); });
  view.querySelectorAll("[data-fm]").forEach(b => b.onclick = () => { F.mode = b.dataset.fm; renderFacts._scrolled = false; renderFacts(view); });
  view.querySelectorAll("[data-rel]").forEach(n => n.onclick = () => { const gx = $("#graph"); const sx = gx.scrollLeft, sy = gx.scrollTop; F.sel = n.dataset.rel; renderFacts(view); if (F.mode === "all") { $("#graph").scrollLeft = sx; $("#graph").scrollTop = sy; } });
  drawFactInspector(g);
  if (out.focus && !renderFacts._scrolled) { renderFacts._scrolled = true; const gx = $("#graph"); gx.scrollLeft = Math.max(0, out.focus.x - 200); gx.scrollTop = Math.max(0, out.focus.y - 160); }
}
function drawFactInspector(g) {
  const d = DATA.decls.find(x => x.file === F.file && x.name === F.sel && x.kind === "relation");
  const rules = DATA.facts[F.file];
  const deriving = rules.filter(r => r.head === F.sel), reading = rules.filter(r => r.body.some(a => a.rel === F.sel));
  const refs = DATA.refs[d.id] || {};
  const crossLabels = Object.keys(refs).filter(k => !/derived by|read by/.test(k));
  const ruleHTML = r => `<div class="rule"><div><span class="atom${r.head === F.sel ? " me" : ""} head" data-r="${esc(r.head)}">${esc(r.head)}(${esc(r.args.join(", "))})</span>${r.body.length ? " :-" : " ;"}</div>${r.body.map((a, k) => `<div style="padding-left:16px"><span class="atom${a.neg ? " neg" : ""}${a.rel === F.sel ? " me" : ""}" data-r="${esc(a.rel)}">${a.rel === "!=" ? esc(a.args[0]) : (a.neg ? "!" : "") + esc(a.rel) + "(" + esc(a.args.join(", ")) + ")"}</span>${k + 1 < r.body.length ? "," : " ;"}</div>`).join("")}<footer>${refChip(F.file, r.line)}</footer></div>`;
  $("#finsp").innerHTML = `<h2>${esc(d.name)}<span class="cols">(${esc(d.cols.join(", "))})</span></h2>
    ${d.doc ? `<p class="muted" style="margin:0">${esc(d.doc)}</p>` : ""}
    <div class="fnlist">${refChip(d.file, d.line)}<span class="tag lc-facts">${g.derived.has(d.name) ? deriving.length + " rule" + (deriving.length === 1 ? "" : "s") : "given"}</span>${g.cyc[g.idx[d.name]] ? `<span class="tag lc-facts">recursive</span>` : ""}${F.file === "src/bundle/link.facts" && TRACED.has(d.name) ? `<button class="fired-badge" data-view="trace">in the trace</button>` : ""}</div>
    ${crossLabels.map(l => `<div><h3 class="section-title">${esc(l)}</h3>${refs[l].map(r => { const e = r.in != null ? DATA.decls[r.in] : null; return `<div class="ref" data-go="${esc(r.file)}:${r.line}" style="grid-template-columns:1fr"><span class="where">${esc(short(r.file))}:${r.line}${e ? " · " + esc(e.name) : ""}</span><span class="txt">${hiLine(r.text, langOf(r.file))}</span></div>`; }).join("")}</div>`).join("")}
    ${deriving.length ? `<div><h3 class="section-title">Derived by</h3><div style="display:flex;flex-direction:column;gap:6px">${deriving.map(ruleHTML).join("")}</div></div>` : ""}
    ${reading.length ? `<div><h3 class="section-title">Read by</h3><div style="display:flex;flex-direction:column;gap:6px">${reading.slice(0, 30).map(ruleHTML).join("")}</div></div>` : ""}`;
  $("#finsp").querySelectorAll("[data-r]").forEach(a => a.onclick = () => { if (g.idx[a.dataset.r] !== undefined) { F.sel = a.dataset.r; renderFacts._scrolled = false; renderFacts($("#view")); } });
}

/* ------------------------------------------------------------ 7. rewrites */
const RW = { file: "src/bundle/minify.rewrite", filter: "" };
const FIRED = { "unparen": "greet", "not-seq": "greet", "fold-add": "unused", "merge-var": "clamp" };
function termTree(t) {
  const PADX = 8, H = 20, VG = 22, HG = 8;
  function lab(n) { return n.n; }
  function cls(n) { const s = n.n; if (s.startsWith("@") || s.startsWith("!@")) return "h"; if (s === "_") return "w"; if (/^[A-Z]/.test(s)) return "k"; return "v"; }
  function size(n) { const own = tw(lab(n)) * 0.92 + PADX * 2; const c = n.c || []; c.forEach(size); const cw = c.reduce((a, k) => a + k._w, 0) + HG * Math.max(0, c.length - 1); n._own = own; n._w = Math.max(own, cw); return n._w; }
  function place(n, x, y) { n._x = x + n._w / 2; n._y = y; const c = n.c || []; const cw = c.reduce((a, k) => a + k._w, 0) + HG * Math.max(0, c.length - 1); let cx = x + (n._w - cw) / 2; c.forEach(k => { place(k, cx, y + H + VG); cx += k._w + HG; }); }
  size(t); place(t, 2, 2);
  let depth = 0; (function d(n, l) { depth = Math.max(depth, l); (n.c || []).forEach(k => d(k, l + 1)); })(t, 0);
  const W = t._w + 4, Hh = (depth + 1) * (H + VG) - VG + 4;
  let lines = "", nodes = "";
  (function w(n) {
    (n.c || []).forEach(k => { lines += `<line x1="${n._x}" y1="${n._y + H}" x2="${k._x}" y2="${k._y}"/>`; w(k); });
    nodes += `<g class="${cls(n)}"><rect x="${n._x - n._own / 2}" y="${n._y}" width="${n._own}" height="${H}" rx="${cls(n) === "k" ? 4 : 10}"/><text x="${n._x}" y="${n._y + H / 2}">${esc(lab(n))}</text></g>`;
  })(t);
  return `<svg class="tree" width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}">${lines}${nodes}</svg>`;
}
function renderRewrites(view) {
  const files = Object.keys(DATA.rewrites);
  const q = RW.filter.trim().toLowerCase();
  const rules = DATA.rewrites[RW.file].filter(r => !q || r.name.includes(q) || r.src.toLowerCase().includes(q));
  const secs = []; for (const r of rules) { let s = secs.find(x => x.name === r.section); if (!s) secs.push(s = { name: r.section, rules: [] }); s.rules.push(r); }
  view.innerHTML = `<div class="toolbar"><span class="seg-ctl" role="group" aria-label="Rewrite file">${files.map(f => `<button data-rf="${esc(f)}" aria-pressed="${f === RW.file}">${esc(short(f).split("/").pop())} <span class="muted">${DATA.rewrites[f].length}</span></button>`).join("")}</span>
      <input id="rwq" placeholder="Filter by rule or node, e.g. Cond" value="${esc(RW.filter)}" aria-label="Filter rules">
      <span class="muted" style="font-size:11.5px"><span class="guard">@host</span> is a test or builder in the host module. Italics bind what they match.</span></div>
    <div class="rw-grid">${secs.map(s => `<section class="rw-sec"><h2>${esc(s.name || "rules")}</h2><div class="rw-list">${s.rules.map(r => `<article class="rwc${FIRED[r.name] && RW.file === "src/bundle/minify.rewrite" ? " fired" : ""}"><header><b>${esc(r.name)}</b>${FIRED[r.name] && RW.file === "src/bundle/minify.rewrite" ? `<button class="fired-badge" data-fire="${FIRED[r.name]}">fired on the example</button>` : ""}${refChip(RW.file, r.line)}</header>
      <div class="pics">${termTree(r.lhs)}<span class="arrow">⇒</span>${termTree(r.rhs)}</div>${r.guards.length ? `<div class="guards"><span class="muted" style="font-size:11px">when</span>${r.guards.map(g => `<span class="guard">${esc(g)}</span>`).join("")}</div>` : ""}</article>`).join("")}</div></section>`).join("") || `<div class="empty">No rule matches “${esc(RW.filter)}”.</div>`}</div>`;
  view.querySelectorAll("[data-rf]").forEach(b => b.onclick = () => { RW.file = b.dataset.rf; renderRewrites(view); });
  view.querySelectorAll("[data-fire]").forEach(b => b.onclick = () => { tSel = b.dataset.fire; goView("trace"); });
  const qi = $("#rwq"); qi.oninput = () => { RW.filter = qi.value; renderRewrites(view); const n = $("#rwq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}

/* ------------------------------------------------------------ 8. pipeline */
const P = DATA.pipeline;
let pStage = "facts";
function fnChip(qn) {
  const m = /^([\w.]+)\/(.+)$/.exec(qn); if (!m) return `<code>${esc(qn)}</code>`;
  const d = DATA.decls.find(x => (x.lang === "rules" || x.lang === "attrs") && DATA.files[x.file].module === m[1] && x.name === m[2]);
  return d ? `<button class="chip lc-${d.lang}" data-decl="${d.id}" title="${esc(qn)}">${esc(m[2])}</button>` : `<code class="muted">${esc(m[2])}</code>`;
}
function stageParts(body) {
  const words = body.split(/\s+/);
  const parts = { does: [] }; let cur = "does";
  const KEYS = { makes: "makes", reads: "reads", also: "also", alone: "alone", is: "is", inside: "inside", gives: "gives", names: "names", by: "by" };
  for (const w of words) { if (KEYS[w]) { cur = KEYS[w]; parts[cur] ||= []; } else parts[cur].push(w); }
  return parts;
}
function renderPipeline(view) {
  const plans = P.plans.map(p => ({ name: p.name, threads: (p.body.find(l => l.startsWith("threads")) || "threads 1").replace("threads ", ""), par: Object.fromEntries(p.body.filter(l => / parallel/.test(l)).map(l => { const [s, , n] = l.split(/\s+/); return [s, n || "yes"]; })) }));
  const mByName = Object.fromEntries(P.mechanisms.map(m => [m.name, m]));
  const PROPS = ["store", "check", "cutoff", "evict", "update"];
  const own = m => Object.fromEntries(m.body.filter(l => PROPS.some(p => l.startsWith(p + " "))).map(l => [l.split(" ")[0], l.slice(l.indexOf(" ") + 1)]));
  const eff = (m, prop) => { let cur = m; while (cur) { const o = own(cur); if (o[prop]) return [o[prop], cur !== m ? cur.name : null]; const f = cur.body.find(l => l.startsWith("from ")); cur = f ? mByName[f.slice(5)] : null; } return [null, null]; };
  const stage = P.stages.find(s => s.name === pStage);
  const sp = stageParts(stage.body);
  view.innerHTML = `<div class="pipe">
    <section class="panel"><header>Stages and plans <span class="sub">a plan that runs a stage in parallel only compiles if that stage's functions share no state</span></header>
      <div style="overflow-x:auto"><table class="matrix"><thead><tr><th>Stage</th><th>Work is cut</th>${plans.map(p => `<th>${esc(p.name)}<br><span class="muted" style="font-weight:400">threads ${esc(p.threads)}</span></th>`).join("")}<th></th></tr></thead><tbody>
      ${P.stages.map(s => `<tr data-st="${esc(s.name)}"${s.name === pStage ? ' style="outline:2px solid var(--l-pipeline);outline-offset:-2px"' : ""}><td class="sname">${esc(s.name)}</td><td class="per">${esc(s.per)}</td>${plans.map(p => { const v = p.par[s.name]; return v ? `<td class="cell par">${v === "yes" ? "parallel" : esc(v)}</td>` : `<td class="cell ser">·</td>`; }).join("")}<td>${refChip(PIPE_FILE, s.line)}</td></tr>`).join("")}</tbody></table></div>
      <div class="stage-detail"><div><b class="mono">${esc(stage.name)}</b> <span class="muted">${esc(stage.per)}.</span> ${esc(stage.doc)}</div>
        <div class="fnlist"><span class="muted">does</span>${sp.does.map(fnChip).join("")}</div>
        ${sp.makes ? `<div class="fnlist"><span class="muted">makes</span>${sp.makes.map(fnChip).join("")}</div>` : ""}
        ${sp.alone ? `<div class="fnlist"><span class="muted">alone</span>${sp.alone.map(fnChip).join("")}${sp.is ? `<span class="muted">is</span>${sp.is.map(fnChip).join("")}` : ""}</div>` : ""}</div></section>
    <section><h3 class="section-title">Mechanisms: how a function's answers are kept</h3><div class="mechs">${P.mechanisms.map(m => { const f = m.body.find(l => l.startsWith("from ")); return `<div class="mech"><h3>${esc(m.name)}${f ? `<small>from ${esc(f.slice(5))}</small>` : ""}<span style="margin-left:auto">${refChip(PIPE_FILE, m.line)}</span></h3>${m.doc ? `<p>${esc(m.doc.length > 220 ? m.doc.slice(0, 218) + "…" : m.doc)}</p>` : ""}<dl class="props">${PROPS.map(p => { const [v, from] = eff(m, p); return v ? `<dt>${p}</dt><dd class="${from ? "inh" : ""}" title="${from ? "from " + esc(from) : "its own"}">${esc(v)}</dd>` : ""; }).join("")}</dl></div>`; }).join("")}</div></section>
    <section><h3 class="section-title">Strategies: which functions are kept, and how</h3><div class="strats">${P.strategies.map(s => {
      const flags = s.body.filter(l => /^(default|tracks|persists|watching)$/.test(l));
      const from = s.body.find(l => l.startsWith("from ")); const uses = s.body.find(l => l.startsWith("uses "));
      const groups = {}; for (const l of s.body.filter(l => l.startsWith("keep "))) { const m = /^keep (with (\S+) )?(.*)$/.exec(l); const k = m[2] || "(the strategy's own)"; (groups[k] ||= []).push(...m[3].split(/\s+/)); }
      const other = s.body.filter(l => /^(trust|recheck|apart)/.test(l));
      return `<div class="strat"><h3>${esc(s.name)}${from ? `<small class="muted">from ${esc(from.slice(5))}</small>` : ""}${uses ? `<span class="tag lc-pipeline">uses ${esc(uses.slice(5))}</span>` : ""}${flags.map(f => `<span class="tag">${esc(f)}</span>`).join("")}<span style="margin-left:auto">${refChip(PIPE_FILE, s.line)}</span></h3>${s.doc ? `<p class="muted" style="margin:0;max-width:90ch">${esc(s.doc)}</p>` : ""}
        ${Object.keys(groups).length ? `<div class="keeps">${Object.entries(groups).map(([k, fs]) => `<div>keep with ${esc(k)}</div><div class="fnlist">${fs.map(fnChip).join("")}</div>`).join("")}</div>` : ""}${other.length ? `<div class="muted mono" style="font-size:11.5px">${other.map(o => esc(o.length > 140 ? o.slice(0, 138) + "…" : o)).join("<br>")}</div>` : ""}</div>`; }).join("")}</div></section>
    <section><h3 class="section-title">Sizes</h3><div class="mechs">${P.sizes.map(z => `<div class="mech"><h3>${fnChip(z.name)}<span class="mono" style="margin-left:auto">${z.value.toLocaleString()}</span></h3><p>${esc(z.doc)}</p></div>`).join("")}</div></section></div>`;
  view.querySelectorAll("[data-st]").forEach(r => r.onclick = e => { if (e.target.closest("[data-go]")) return; pStage = r.dataset.st; const y = $("#view").scrollTop; renderPipeline(view); $("#view").scrollTop = y; });
}
const PIPE_FILE = "src/app/build.pipeline";

navButtons();
window.addEventListener("hashchange", route);
route();
</script>
