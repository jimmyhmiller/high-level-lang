<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One graph, two environments</title>
<style>
  body { max-width: 46rem; margin: 12vh auto; padding: 1.5rem; font: 18px/1.6 system-ui; color: #172c37; background: #f5f7f4; }
  h1 { line-height: 1.15; letter-spacing: -.04em; font-size: 2.7rem; }
  button { padding: .8rem 1.3rem; font: inherit; background: #195e48; color: white; border: 0; border-radius: .4rem; cursor: pointer; }
  code { background: #e6ece6; padding: .1rem .3rem; border-radius: .2rem; }
  #status { color: #476152; }
</style>
<h1>One graph.<br>Two environments.</h1>
<p>The server imports a <code>"use client"</code> module. It receives a reference;
the browser receives the implementation. Shared code is compiled into both.</p>
<div id="app" aria-live="polite">Loading the client module…</div>
<p id="status"></p>
<p><a href="manifest.json">Inspect the generated boundary manifest</a></p>
<script type="module">
  import { resolveClientReference } from "./client.mjs";
  try {
    const response = await fetch("./model.json");
    if (!response.ok) throw new Error("Could not load the server model");
    const model = await response.json();
    const Component = resolveClientReference(model.component);
    resolveClientReference(model.mount)(document.getElementById("app"), Component, model.props);
    document.getElementById("status").textContent = "Reference resolved: " + model.component.module + " → " + model.component.export;
  } catch (error) {
    document.getElementById("app").textContent = error.message;
    throw error;
  }
</script>
</html>
